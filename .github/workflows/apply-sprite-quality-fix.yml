name: Apply sprite quality fix
on:
  push:
    paths:
      - "tools/apply_sprite_quality_fix.py"
      - ".github/workflows/apply-sprite-quality-fix.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch sprite runtime
        run: python tools/apply_sprite_quality_fix.py
      - name: Commit patched game
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Improve sprite cleanup and restore fighter animation"
          git push
