name: Restore campaign sprite edges
on:
  push:
    paths:
      - ".github/workflows/restore-campaign-sprites.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: python tools/restore_campaign_sprite_edges.py --apply
      - name: Commit restored PNGs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --             assets/pixel-allies-keyed.png             assets/pixel-ally-rockshield-v1.png             assets/pixel-enemies-keyed.png             assets/pixel-ally-lightning-otter-v1.png             assets/pixel-ally-gale-hawk-v3.png             assets/pixel-ally-herb-hedgehog-v1.png             assets/pixel-ally-squirrel-scout-v1.png             assets/pixel-ally-bomber-v1.png             assets/pixel-ally-sniper-v1.png             assets/pixel-ally-drummer-v1.png             assets/pixel-ally-scout-v1.png             assets/pixel-enemy-mist-fox-v1.png             assets/pixel-enemy-shell-toad-v1.png             assets/pixel-enemy-spitter-mole-v1.png             assets/pixel-enemy-thorn-shaman-v1.png             assets/pixel-enemy-iron-giant-v1.png             assets/pixel-enemy-thorn-king-v1.png             assets/pixel-enemy-nightlord-v1.png
          git diff --cached --quiet && exit 0
          git commit -m "Apply campaign sprite edge restoration"
          git push
