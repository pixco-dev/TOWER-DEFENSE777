div class="help">번호를 누르면 결석 처리됩니다.</div><div class="div"></div><div class="head"><span>팀 편성</span><span id="tc">0팀</span></div><div class="teams" id="teams"></div></aside><section class="panel bracketpanel"><div class="bhead"><div><div class="head" style="margin:0">토너먼트</div><div class="legend">이긴 팀을 클릭하면 다음 라운드로 진출합니다. 점수판은 대진과 별개입니다.</div></div><div class="status" id="status"></div></div><div class="scroll"><div class="bracket" id="bracket"></div></div><div id="champ"></div></section></div></div><script>(()=>{const q=s=>document.querySelector(s),S={abs:new Set(),teams:[],rounds:[],scores:{}},nums=q('#nums'),teams=q('#teams'),br=q('#bracket');const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const tid=()=>Math.random().toString(36).slice(2,8);for(let n=1;n<=21;n++){let d=document.createElement('div');d.className='num';d.innerHTML=`<input id="n${n}" type="checkbox"><label for="n${n}">${n}</label>`;let c=d.firstChild;c.onchange=()=>{c.checked?S.abs.add(n):S.abs.delete(n);q('#present').textContent=`${21-S.abs.size}명 참가`};nums.appendChild(d)}function tt(t){return t?`${t.name} · ${t.members.join(', ')}번`:'미정'}function rt(){q('#tc').textContent=`${S.teams.length}팀`;teams.innerHTML='';if(!S.teams.length){teams.innerHTML='<div class="empty">팀 랜덤 편성을 눌러주세요.</div>';return}S.teams.forEach(t=>{let d=document.createElement('div');d.className='teamrow';d.innerHTML=`<b>${t.name}</b><span>${t.members.join(' · ')}번</span>`;teams.appendChild(d)})}function mkTeams(){let p=[];for(let n=1;n<=21;n++)if(!S.abs.has(n))p.push(n);if(p.length<2)return alert('최소 2명 이상 참가해야 합니다.');p=sh(p);let ts=[],end=p.length;if(p.length%2)end-=3;for(let i=0;i<end;i+=2)ts.push({id:tid(),name:`${ts.length+1}팀`,members:[p[i],p[i+1]]});if(p.length%2)ts.push({id:tid(),name:`${ts.length+1}팀`,members:p.slice(-3)});S.teams=ts;rt();mkBracket()}function mkBracket(){if(!S.teams.length)return mkTeams();let first=sh(S.teams),rounds=[],count=first.length,r=0;while(count>1){let mc=Math.ceil(count/2),arr=[];for(let i=0;i<mc;i++){let ea=i*2<count,eb=i*2+1<count;arr.push({a:r===0&&ea?first[i*2]:null,b:r===0&&eb?first[i*2+1]:null,w:null,ea,eb})}rounds.push(arr);count=mc;r++}S.rounds=rounds;auto();render()}function place(r,i,t){if(r>=S.rounds.length-1)return;let n=S.rounds[r+1][Math.floor(i/2)];i%2?n.b=t:n.a=t}function auto(){let ch=true;while(ch){ch=false;S.rounds.forEach((rd,r)=>rd.forEach((m,i)=>{if(m.w)return;let one=(m.ea&&!m.eb&&m.a)||(!m.ea&&m.eb&&m.b);if(one){m.w=m.a||m.b;place(r,i,m.w);ch=true}}))}}function clear(r,i){if(r>=S.rounds.length-1)return;let ni=Math.floor(i/2),n=S.rounds[r+1][ni];i%2?n.b=null:n.a=null;n.w=null;clear(r+1,ni)}function win(r,i,t){let m=S.rounds[r][i];if(!m||!m.a||!m.b||m.w)return;clear(r,i);m.w=t;place(r,i,t);auto();render()}function rn(r,total){if(r===total-1)return'결승';if(r===total-2)return'4강';if(r===total-3)return'8강';if(r===total-4)return'16강';return`${S.rounds[r].length*2}강`}function render(){br.innerHTML='';q('#champ').innerHTML='';if(!S.rounds.length){br.innerHTML='<div class="empty">팀을 먼저 만들어주세요.</div>';return}let total=S.rounds.length;S.rounds.forEach((rd,r)=>{let col=document.createElement('div');col.className='round';col.innerHTML=`<div class="rtitle">${rn(r,total)}</div>`;let ms=document.createElement('div');ms.className='matches';rd.forEach((m,i)=>{let w=document.createElement('div');w.className='wrap'+(r===total-1?' last':'');let box=document.createElement('div');box.className='match';box.innerHTML=`<div class="mlabel">경기 ${i+1}</div>`;['a','b'].forEach(s=>{let t=m[s],row=document.createElement('div');row.className='slot'+(m.w&&t&&m.w.id===t.id?' win':'');if(t){let b=document.createElement('button');b.className='teambtn';b.textContent=tt(t);b.onclick=()=>win(r,i,t);row.appendChild(b);let mk=document.createElement('div');mk.className='mark';mk.textContent=m.w&&m.w.id===t.id?'✓':'';row.appendChild(mk)}else{let d=document.createElement('div');d.className='bye';d.textCon ia(max-width:700px){.board{grid-template-columns:1fr}.s{font-size:100px}}</style></head><body><div class="x"><div class="top"><h2>탁구 점수판</h2><span>대진표와 완전히 별개</span></div><div class="board"><section class="t" id="ta"><input class="name" id="na" value="팀 A"><div class="s" id="sa">0</div><div class="c"><button class="m" id="ma">−</button><button class="p" id="pa">+</button></div><button class="w" id="wa">팀 A 승리</button></section><section class="t" id="tb"><input class="name" id="nb" value="팀 B"><div class="s" id="sb">0</div><div class="c"><button class="m" id="mb">−</button><button class="p" id="pb">+</button></div><button class="w" id="wb">팀 B 승리</button></section></div><div class="res" id="res"></div><div class="foot"><button class="sm" id="rs">점수 0 : 0</button><button class="sm" id="cw">승리 표시 취소</button><button class="sm" id="cl">닫기</button></div><div class="note">점수가 몇 점이 되어도 자동 승리 처리되지 않습니다.</div></div><script>let a=0,b=0,w=null;let na=document.getElementById('na'),nb=document.getElementById('nb'),sa=document.getElementById('sa'),sb=document.getElementById('sb'),ta=document.getElementById('ta'),tb=document.getElementById('tb'),wa=document.getElementById('wa'),wb=document.getElementById('wb'),res=document.getElementById('res');function r(){sa.textContent=a;sb.textContent=b;wa.textContent=(na.value||'팀 A')+' 승리';wb.textContent=(nb.value||'팀 B')+' 승리';ta.classList.toggle('sel',w==='a');tb.classList.toggle('sel',w==='b');res.textContent=w==='a'?'승리: '+na.value:w==='b'?'승리: '+nb.value:''}ma.onclick=()=>{a=Math.max(0,a-1);r()};pa.onclick=()=>{a++;r()};mb.onclick=()=>{b=Math.max(0,b-1);r()};pb.onclick=()=>{b++;r()};wa.onclick=()=>{w='a';r()};wb.onclick=()=>{w='b';r()};na.oninput=r;nb.oninput=r;rs.onclick=()=>{a=b=0;r()};cw.onclick=()=>{w=null;r()};cl.onclick=()=>window.close();r();<\/script></body></html>`);p.document.close()}q('#make').onclick=mkTeams;q('#reshuffle').onclick=mkBracket;q('#score').onclick=scoreboard;q('#reset').onclick=()=>{if(S.teams.length)mkBracket()
