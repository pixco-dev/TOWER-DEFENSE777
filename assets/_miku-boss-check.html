<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>미쿠 보스 프레임 확인</title>
  <style>
    :root { color-scheme: dark; --teal:#48eadc; --pink:#ff4faf; --panel:#181b27; --line:#34394f; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:#0d0f17; color:#f4f5fb; font-family:system-ui,sans-serif; }
    main { width:min(1180px,100%); margin:auto; padding:28px 20px 48px; }
    h1 { margin:0 0 5px; color:#78fff1; font-size:clamp(25px,4vw,42px); }
    .sub { margin:0 0 22px; color:#aeb5c8; }
    .stage { position:relative; min-height:420px; display:grid; place-items:center; overflow:hidden; border:3px solid var(--line); background:
      linear-gradient(45deg,#171a25 25%,transparent 25%),linear-gradient(-45deg,#171a25 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#171a25 75%),linear-gradient(-45deg,transparent 75%,#171a25 75%),#10131d;
      background-size:32px 32px; background-position:0 0,0 16px,16px -16px,-16px 0; }
    .stage::after { content:""; position:absolute; inset:auto 8% 10% 8%; height:4px; background:linear-gradient(90deg,transparent,var(--teal),var(--pink),transparent); opacity:.55; }
    #hero { width:min(520px,78vw); height:350px; object-fit:contain; image-rendering:pixelated; filter:drop-shadow(0 14px 0 #0008); transition:transform .08s steps(2); z-index:1; }
    #hero.flip { transform:scaleX(-1); }
    #hero.hit { animation:hit .58s steps(4); }
    @keyframes hit { 0%{translate:0 0} 45%{translate:-18px -5px} 100%{translate:0 0} }
    .badge { position:absolute; left:18px; top:16px; z-index:2; padding:8px 12px; background:#090b12dd; border-left:5px solid var(--pink); font-weight:900; }
    .controls { display:flex; flex-wrap:wrap; gap:9px; padding:16px 0 22px; }
    button { border:2px solid var(--line); background:#202436; color:#fff; padding:11px 16px; font-weight:800; cursor:pointer; }
    button:hover,button.active { border-color:var(--teal); color:#8afff4; background:#28304a; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
    .card { display:grid; grid-template-rows:210px auto; background:var(--panel); border:2px solid #282d40; padding:10px; }
    .card img { width:100%; height:100%; object-fit:contain; image-rendering:pixelated; }
    .card img.flip { transform:scaleX(-1); }
    .card strong { text-align:center; padding:9px 4px 4px; color:#d9fff9; }
    .note { color:#8992aa; margin-top:18px; font-size:14px; }
  </style>
</head>
<body>
  <main>
    <h1>MIKU BOSS · 단일 캐릭터</h1>
    <p class="sub">대기 2프레임과 네 가지 기술 프레임만 표시합니다.</p>
    <section class="stage">
      <div id="label" class="badge">대기 애니메이션</div>
      <img id="hero" class="flip" src="candidates/unified-v1/miku-diva.png" alt="미쿠 보스">
    </section>
    <nav class="controls" aria-label="프레임 선택">
      <button data-action="idle" class="active">자동 재생</button>
      <button data-action="song">노래 공격</button>
      <button data-action="leek">대파 베기</button>
      <button data-action="guard">스피커 방어</button>
      <button data-action="cannon">라이브 캐논</button>
    </nav>
    <section id="grid" class="grid"></section>
    <p class="note">검은 배경은 투명 여부를 쉽게 확인하기 위한 페이지 배경이며 이미지에 포함되지 않습니다.</p>
  </main>
  <script>
    const frames = {
      idleA: { file:"miku-diva", label:"대기 A", flip:true },
      idleB: { file:"miku-idle-b", label:"대기 B", flip:true },
      song: { file:"miku-note", label:"노래 투사", flip:true },
      leek: { file:"miku-leek", label:"대파 베기", flip:true },
      guard: { file:"miku-speaker", label:"스피커 방어", flip:true },
      cannon: { file:"miku-cannon", label:"라이브 캐논", flip:false },
    };
    const hero = document.querySelector("#hero");
    const label = document.querySelector("#label");
    let timer = 0;
    let idleTick = 0;
    function show(key, animate=true) {
      const frame = frames[key];
      hero.src = `candidates/unified-v1/${frame.file}.png`;
      hero.classList.toggle("flip", frame.flip);
      label.textContent = frame.label;
      if (animate) {
        hero.classList.remove("hit");
        void hero.offsetWidth;
        hero.classList.add("hit");
      }
    }
    function autoplay() {
      clearInterval(timer);
      show("idleA", false);
      timer = setInterval(() => show(++idleTick % 2 ? "idleB" : "idleA", false), 430);
    }
    document.querySelectorAll("button").forEach((button) => button.addEventListener("click", () => {
      document.querySelectorAll("button").forEach((item) => item.classList.toggle("active", item === button));
      if (button.dataset.action === "idle") return autoplay();
      clearInterval(timer);
      show(button.dataset.action);
    }));
    const grid = document.querySelector("#grid");
    Object.values(frames).forEach((frame) => {
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `<img class="${frame.flip ? "flip" : ""}" src="candidates/unified-v1/${frame.file}.png" alt="${frame.label}"><strong>${frame.label}</strong>`;
      grid.append(card);
    });
    autoplay();
  </script>
</body>
</html>
